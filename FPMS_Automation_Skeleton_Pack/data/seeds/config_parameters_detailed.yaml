system_params:
- id: DS-CFG-SYS-DEFAULT-CURRENCY
  api: PUT /system/params/default_currency
  table: t_system_param
  payload:
    param_value: CNY
    value_type: string
    description: 默认币种
    is_secret: false
  purpose: 新建费用、客户或账单未显式指定币种时的默认配置基线。
  current_implementation_note: 当前 seed 已包含 default_currency，但需要测试确认实际业务流是否读取。
- id: DS-CFG-SYS-BILL-TEMPLATE
  api: PUT /system/params/bill_template_path
  table: t_system_param
  payload:
    param_value: templates/bill_standard_${RUN_ID}.docx
    value_type: string
    description: 账单打印模板路径
    is_secret: false
  purpose: 账单打印接口读取该参数定位 docx 模板。
  current_implementation_note: 当前 seed 未包含 bill_template_path；账单打印 readiness 应报告缺配置。
- id: DS-CFG-SYS-TASK-SHEET-TEMPLATE
  api: PUT /system/params/task_sheet_template_path
  table: t_system_param
  payload:
    param_value: templates/task_sheet.docx
    value_type: string
    description: 任务单模板路径
    is_secret: false
  purpose: 任务打印接口读取该参数定位任务单模板。
  current_implementation_note: 当前 seed 已包含 task_sheet_template_path。
- id: DS-CFG-SYS-COMMISSION-WAITPAY-THRESHOLD
  api: PUT /system/params/commission_wait_pay_threshold
  table: t_system_param
  payload:
    param_value: "1.00"
    value_type: decimal
    description: SPEC 期望的款到后可结算比例阈值
    is_secret: false
  purpose: SPEC 中 WaitPay 阈值配置测试数据。
  current_implementation_note: 当前 commission 逻辑主要使用规则 wait_pay/force_settle 和收款状态；未确认该系统参数被读取，应作为 gap 验证。
- id: DS-CFG-SYS-SECRET-SAMPLE
  api: PUT /system/params/external_storage_token
  table: t_system_param
  payload:
    param_value: secret-${RUN_ID}
    value_type: string
    description: 密文遮蔽测试参数
    is_secret: true
  purpose: 验证系统参数列表和前端不会泄漏密文。

