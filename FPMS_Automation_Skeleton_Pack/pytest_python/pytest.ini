[pytest]
minversion = 8.0
addopts = -ra
testpaths = tests
markers =
    p0: Priority P0
    p1: Priority P1
    p2: Priority P2
    happy: Happy path
    unhappy: Unhappy path
    boundary: Boundary case
    audit: Audit/log related
    permission: Permission related
    report: Report/export related
    wave_w0: Wave W0 基础配置
    wave_a: Wave A 新案申请
    wave_b: Wave B OA/补正
    wave_c: Wave C PCT→国家阶段
    wave_g0: Wave G0 授权阶段
    wave_d: Wave D 年费周期
    wave_e: Wave E 无效/诉讼
    wave_f: Wave F 预收款
    wave_g: Wave G 催款与坏账
    wave_h: Wave H 顾问/检索
    wave_x: Wave X 查询/报表/审计
