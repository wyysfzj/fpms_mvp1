[project]
name = "fpms-api"
version = "0.1.0"
description = "FPMS MVP1 API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "alembic>=1.13.0",
  "python-multipart>=0.0.9",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt<5",
  "python-jose[cryptography]>=3.3.0",
  "docxtpl>=0.17.0",
  "python-docx>=1.1.2",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100
fix = true

# 核心规则集：质量 + import + 常见 bug
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort (import order)
  "B",    # flake8-bugbear
]

# 全局忽略（极少数）
ignore = [
  "E203", # 与 black/ruff-format 冲突
]

# 明确哪些目录是“工具生成/框架约定”，不强求 Python 风格
exclude = [
  ".venv",
  "node_modules",
  "dist",
  "build",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.per-file-ignores]
# Alembic 必须在修改 sys.path 后 import app（官方惯例）
"alembic/env.py" = ["E402"]

# Alembic migration 文件：允许工具生成的 import 顺序
"alembic/versions/*.py" = ["I001"]

# FastAPI router 装饰器里使用 Depends 是惯例（但我们已规范写法，留作兜底）
"**/api.py" = ["B008"]

[tool.ruff.isort]
known-first-party = ["app"]
combine-as-imports = true
force-single-line = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::sqlalchemy.exc.SAWarning",
]
